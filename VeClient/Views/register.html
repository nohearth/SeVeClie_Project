<div class="d-flex justify-content-center">
    <div class="container-registro">
        <h2>Crear Nueva Cuenta</h2>
        <div class="form-group">
            <label>Nombre de Usuario (Email):</label>
            <input type="text" id="reg-user" class="form-control" placeholder="ejemplo@correo.com" />
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="reg-pass" class="form-control" />
        </div>
        <div class="form-group">
            <label>Confirmar Contraseña:</label>
            <input type="password" id="reg-pass-confirm" class="form-control" />
        </div>
        <br />
        <button id="btn-registrar-ajax" class="btn btn-primary">Registrarme</button>
        <button id="btn-volver-login" class="btn btn-link">Ya tengo cuenta</button>

        <p id="msg-registro" style="display:none; margin-top:10px;"></p>
    </div>
</div>
