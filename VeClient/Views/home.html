<div class="card shadow-sm">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Gestión de Clientes</h5>
        <button type="button" class="btn btn-light btn-sm" onclick="printReport()">
            <i class="fa fa-print"></i> Imprimir Tabla
        </button>
        <button class="btn btn-light btn-sm" data-toggle="modal" data-target="#modalCliente" onclick="initNew()">
            Nuevo Cliente
        </button>
    </div>

    <div class="table-responsive">
        <table id="table-clie" class="table table-striped table-bordered" style="width:100%">
            <thead>
                <tr>
                    <th>Cedula</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Genero</th>
                    <th>Fecha Nac</th>
                    <th>Estado Civil</th>
                    <th>Opciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="modalCliente" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Detalle del Cliente</h5>
                <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <form id="formCliente">
                    <input type="hidden" id="txtId">

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Cédula:</label>
                            <input type="text" id="txtCedula" class="form-control">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Nombre:</label>
                            <input type="text" id="txtNombre" class="form-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Apellido:</label>
                            <input type="text" id="txtApellido" class="form-control">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Género:</label>
                            <select id="ddlGenero" class="form-control">
                                <option value="">Seleccione...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Fecha de Nacimiento:</label>
                            <input type="date" id="txtFechaNac" class="form-control">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Estado Civil:</label>
                            <select id="ddlEstadoCivil" class="form-control">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="sendInfo()">Guardar</button>
            </div>
        </div>
    </div>
</div>
