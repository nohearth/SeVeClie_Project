<div class="d-flex justify-content-center">
    <div class="container-login">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <div class="form-group">
                <label>Usuario / Email</label>
                <input type="text" id="txt-user" class="form-control" placeholder="ejemplo@correo.com" />
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="txt-pass" class="form-control" />
            </div>
            <button id="btn-entrar" type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <p>¿No tienes cuenta? <a href="#" id="link-ir-registro">Regístrate aquí</a></p>
        </div>
    </div>
</div>
